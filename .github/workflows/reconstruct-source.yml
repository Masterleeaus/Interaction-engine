name: Reconstruct Interaction Engine Source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconstruct-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  reconstruct:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/full-engine-template-upgrade') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/full-engine-template-upgrade')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-engine-template-upgrade
          fetch-depth: 0
          persist-credentials: true

      - name: Download and reconstruct verified source
        shell: bash
        env:
          SOURCE_URL: https://interaction-engine-source-v2.miniup.app/interaction-engine-source.tar.gz
          SOURCE_SHA256: 4437fbcd395f03014ba983ebfb702476ed945fa221edece0ca34019ad3c564eb
        run: |
          set -euo pipefail

          if [[ -f composer.json && -d src && -d wizards && -f bin/verify.php && ! -d .bootstrap && ! -d .bootstrap-lite ]]; then
            echo "Reviewable source is already reconstructed."
            exit 0
          fi

          archive=/tmp/interaction-engine-source.tar.gz
          unpacked=/tmp/interaction-engine-unpacked
          rm -rf "$archive" "$unpacked"
          mkdir -p "$unpacked"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            "$SOURCE_URL" --output "$archive"

          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ "$actual" != "$SOURCE_SHA256" ]]; then
            echo "Source checksum mismatch: expected $SOURCE_SHA256, received $actual"
            exit 1
          fi

          tar -tzf "$archive" >/tmp/archive-list.txt
          tar -xzf "$archive" -C "$unpacked"

          package_root=''
          while IFS= read -r composer_file; do
            candidate="$(dirname "$composer_file")"
            if [[ -d "$candidate/src" && -d "$candidate/wizards" && -f "$candidate/bin/verify.php" ]]; then
              package_root="$candidate"
              break
            fi
          done < <(find "$unpacked" -type f -name composer.json | sort)

          if [[ -z "$package_root" ]]; then
            echo "Could not locate a valid Interaction Engine package root."
            exit 1
          fi

          echo "Recovered package root: $package_root"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/reconstruct-source.yml' \
            "$package_root/" ./

          rm -rf .bootstrap .bootstrap-lite .bootstrap-v2

          test -f composer.json
          test -d src
          test -d wizards
          test -d templates
          test -f bin/verify.php

      - name: Verify reconstructed package
        shell: bash
        run: |
          set -euo pipefail

          php bin/verify.php

          php_files=()
          while IFS= read -r -d '' file; do
            php_files+=("$file")
          done < <(find src tests bin routes config database -type f -name '*.php' -print0 2>/dev/null)
          for file in "${php_files[@]}"; do
            php -l "$file" >/dev/null
          done

          json_files=()
          while IFS= read -r -d '' file; do
            json_files+=("$file")
          done < <(find wizards templates resources config reports -type f -name '*.json' -print0 2>/dev/null)
          for file in "${json_files[@]}"; do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
          done

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconstruction changes to commit."
            exit 0
          fi
          git commit -m "feat: publish governed assurance templates"
          git push origin HEAD:feature/full-engine-template-upgrade
