name: Reconstruct Interaction Engine Source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconstruct-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  reconstruct:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/full-engine-template-upgrade') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/full-engine-template-upgrade')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-engine-template-upgrade
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          chunks=(.bootstrap-lite/chunk-*)
          if (( ${#chunks[@]} == 0 )); then
            echo "No bootstrap-lite chunks remain; source is already reconstructed."
            exit 0
          fi

          LC_ALL=C printf '%s\n' "${chunks[@]}" | sort > /tmp/chunks.txt
          while IFS= read -r chunk; do
            tr -d '\r\n[:space:]' < "$chunk"
          done < /tmp/chunks.txt > /tmp/interaction-engine.payload.b64

          base64 --decode /tmp/interaction-engine.payload.b64 > /tmp/interaction-engine.payload
          test -s /tmp/interaction-engine.payload

          rm -rf /tmp/interaction-engine-unpacked
          mkdir -p /tmp/interaction-engine-unpacked

          if tar -tzf /tmp/interaction-engine.payload >/tmp/archive-list.txt 2>/dev/null; then
            tar -xzf /tmp/interaction-engine.payload -C /tmp/interaction-engine-unpacked
          elif unzip -t /tmp/interaction-engine.payload >/tmp/archive-list.txt 2>/dev/null; then
            unzip -q /tmp/interaction-engine.payload -d /tmp/interaction-engine-unpacked
          else
            echo "Bootstrap payload is neither a valid gzip tar archive nor a ZIP archive."
            file /tmp/interaction-engine.payload || true
            exit 1
          fi

          package_root=''
          while IFS= read -r composer_file; do
            candidate="$(dirname "$composer_file")"
            if [[ -d "$candidate/src" && -d "$candidate/wizards" && -f "$candidate/bin/verify.php" ]]; then
              package_root="$candidate"
              break
            fi
          done < <(find /tmp/interaction-engine-unpacked -type f -name composer.json | sort)

          if [[ -z "$package_root" ]]; then
            echo "Could not locate an Interaction Engine package root in the reconstructed archive."
            find /tmp/interaction-engine-unpacked -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "Recovered package root: $package_root"
          rsync -a \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.bootstrap-lite/' \
            --exclude='.github/workflows/reconstruct-source.yml' \
            "$package_root/" ./

          rm -rf .bootstrap .bootstrap-lite

          test -f composer.json
          test -d src
          test -d wizards
          test -f bin/verify.php

      - name: Verify reconstructed package
        shell: bash
        run: |
          set -euo pipefail

          php bin/verify.php

          if [[ -f tests/template_catalogue_run.php ]]; then
            php tests/template_catalogue_run.php
          fi

          if [[ -f package.json ]]; then
            npm test
          fi

          php_files=()
          while IFS= read -r -d '' file; do
            php_files+=("$file")
          done < <(find src tests bin routes config database -type f -name '*.php' -print0 2>/dev/null)
          for file in "${php_files[@]}"; do
            php -l "$file" >/dev/null
          done

          json_files=()
          while IFS= read -r -d '' file; do
            json_files+=("$file")
          done < <(find wizards templates resources config reports -type f -name '*.json' -print0 2>/dev/null)
          for file in "${json_files[@]}"; do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
          done

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconstruction changes to commit."
            exit 0
          fi
          git commit -m "chore: reconstruct interaction engine source"
          git push origin HEAD:feature/full-engine-template-upgrade
