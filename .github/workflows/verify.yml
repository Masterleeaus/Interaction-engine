name: Verify Interaction Engine

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate Composer package metadata
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Verify maintained-file SHA-256 manifest
        run: php bin/manifest.php

      - name: Run complete PHP and TypeScript verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          php bin/verify.php | tee coverage/verification.txt

      - name: Generate PHP coverage report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          PHP_COVERAGE_OUTPUT=coverage/php.json php -dauto_prepend_file=tests/coverage-bootstrap.php tests/run.php | tee coverage/php-tests.txt
          test -s coverage/php.json
          PHP_COVERAGE_OUTPUT=coverage/policy-php.json php -dauto_prepend_file=tests/coverage-bootstrap.php packages/policy-engine/tests/run.php | tee coverage/policy-php-tests.txt
          test -s coverage/policy-php.json

      - name: Run 100-case authority evaluation
        run: php bin/authority-eval.php coverage/authority-evaluation.json > coverage/authority-evaluation.stdout

      - name: Run measured benchmarks
        shell: bash
        run: |
          set -euo pipefail
          php bin/benchmark.php coverage/performance-php.json > coverage/performance-php.stdout
          npm run benchmark:offline -- coverage/performance-typescript.json > coverage/performance-typescript.stdout

      - name: Store test, coverage, evaluation, and benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-engine-evidence
          path: coverage/
          if-no-files-found: warn
          retention-days: 30
