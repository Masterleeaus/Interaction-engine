<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Titan Zero Interaction Engine</title>
  <desc id="desc">A blue and violet interaction runtime banner showing multiple input surfaces converging on governed workflows with an offline outbox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#3a3b86"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9fe7ff"/><stop offset="1" stop-color="#d5b5ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern>
    <style>
      .title{font:700 41px Segoe UI,Arial,sans-serif;fill:#f7f8ff}.sub{font:600 15px Segoe UI,Arial,sans-serif;letter-spacing:2.6px;fill:#e1e0fa}.eyebrow{font:700 12px Segoe UI,Arial,sans-serif;letter-spacing:2.5px;fill:#a8e4ff}.label{font:700 12px Segoe UI,Arial,sans-serif;fill:#fff}.tiny{font:400 11px Segoe UI,Arial,sans-serif;fill:#d1d4ef}.chip{fill:#ffffff;fill-opacity:.10;stroke:#fff;stroke-opacity:.24}
    </style>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1080" cy="25" r="230" fill="#a07aff" opacity=".11"/><circle cx="160" cy="395" r="230" fill="#42c8ff" opacity=".11"/>
  <text x="70" y="66" class="eyebrow">TITAN ZERO � INTERACTION RUNTIME � ONLINE + OFFLINE</text>
  <text x="70" y="125" class="title">Titan Zero Interaction Engine</text>
  <text x="72" y="160" class="sub">SURFACES    WIZARDS    POLICY    TRACEABLE OUTCOMES</text>
  <g class="chip"><rect x="78" y="218" width="92" height="34" rx="17"/><rect x="182" y="218" width="92" height="34" rx="17"/><rect x="286" y="218" width="92" height="34" rx="17"/><rect x="390" y="218" width="92" height="34" rx="17"/></g>
  <text x="124" y="240" text-anchor="middle" class="label">Chat</text><text x="228" y="240" text-anchor="middle" class="label">Voice</text><text x="332" y="240" text-anchor="middle" class="label">Mobile</text><text x="436" y="240" text-anchor="middle" class="label">API</text>
  <path d="M500 235H602" stroke="url(#route)" stroke-width="3"/><rect x="602" y="216" width="72" height="38" rx="19" fill="#6c6ab9" stroke="#c3c1ff" stroke-width="2"/><text x="638" y="240" text-anchor="middle" class="label">Wizard</text><path d="M674 235H770" stroke="url(#route)" stroke-width="3"/>
  <rect x="770" y="208" width="148" height="54" rx="12" fill="#4f4da1" stroke="#d5b5ff" stroke-width="2"/><text x="844" y="231" text-anchor="middle" class="label">Policy +</text><text x="844" y="248" text-anchor="middle" class="label">capabilities</text>
  <path d="M918 235H1035" stroke="url(#route)" stroke-width="3"/><rect x="1035" y="208" width="98" height="54" rx="12" fill="#304c7c" stroke="#a8e4ff" stroke-width="2"/><text x="1084" y="231" text-anchor="middle" class="label">Online</text><text x="1084" y="248" text-anchor="middle" class="tiny">or outbox</text>
  <text x="70" y="306" class="tiny">Universal Wizard Engine � versioned templates � tenant + actor context � IndexedDB sync</text>
  <text x="70" y="342" class="tiny">Understanding and recommending never confer authority</text>
</svg>

